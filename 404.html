<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found</title>

<!-- FONT AWESOME -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* ================= GLOBAL ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;

    min-height:100vh;

    background:#f8f5f2;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow-x:hidden;

    padding:20px;
}

/* ================= CONTAINER ================= */

.error-container{
    width:100%;
    max-width:1200px;

    background:white;

    border-radius:30px;

    overflow:hidden;

    display:grid;
    grid-template-columns:1fr 1fr;

    box-shadow:
    0 15px 40px rgba(0,0,0,0.08);
}

/* ================= LEFT ================= */

.error-left{
    padding:80px 60px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

/* ================= LOGO ================= */

.logo{
    font-size:38px;
    font-weight:bold;
    margin-bottom: clamp(10px,2vw,30px);
    color:#c97d53;


}

  .logo img{
        width:clamp(170px,20vw,260px);
    }

/* ================= TEXT ================= */

.error-left h1{
    font-size:140px;
    line-height:1;

    color:#1f1f1f;

    margin-bottom:20px;
}

.error-left h2{
    font-size:42px;
    color:#222;

    margin-bottom:20px;
}

.error-left p{
    font-size:18px;
    line-height:1.8;

    color:#666;

    margin-bottom:40px;
}

/* ================= BUTTONS ================= */

.btn-group{
    display:flex;
    gap:20px;

    flex-wrap:wrap;
}

.btn-group a{
    padding:16px 35px;

    border-radius:14px;

    text-decoration:none;

    font-size:16px;
    font-weight:600;

    transition:0.3s;
}

/* PRIMARY BUTTON */

.home-btn{
    background:#B8912E;
    color:white;
    display: flex;
    gap: 5px;
    align-items: center;
}

.home-btn:hover{
    background:#e0ad2a;
    color: black;
}

/* SECOND BUTTON */

.shop-btn{
    border:2px solid #B8912E;
    color:#B8912E;
}

.shop-btn:hover{
     background:#e0ad2a;
    color:rgb(0, 0, 0);
}

/* ================= RIGHT ================= */

.error-right{
    background:
    linear-gradient(
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.15)
    ),
    url("./src/photo-1445205170230-053b83016050-compressed.webp");

    background-size:cover;
    background-position:center;

    position:relative;

    min-height:700px;
}

/* ================= FLOATING CARD ================= */

.floating-card{

    position:absolute;

    bottom:40px;
    left:40px;

    background:white;

    padding:25px 30px;

    border-radius:20px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
}

.floating-card h3{
    font-size:24px;
    color:#222;

    margin-bottom:10px;
}

.floating-card p{
    color:#666;
    line-height:1.7;
}

/* ================= RESPONSIVE ================= */

@media(max-width:991px){

    .error-container{
        grid-template-columns:1fr;
    }

    .error-right{
        min-height:450px;
    }

    .error-left{
        padding:60px 40px;
    }

    .error-left h1{
        font-size:110px;
    }

    .error-left h2{
        font-size:34px;
    }

}

@media(max-width:580px){

    .error-left{
        padding:30px 25px;
    }

    .error-left h1{
        font-size:80px;
    }

    .error-left h2{
        font-size:26px;
    }

    .error-left p{
        font-size:16px;
    }

    .btn-group{
        flex-direction:column;
    }

    .btn-group a{
        width:100%;
          justify-content: center;
        text-align:center;
    }

    .error-right{
        min-height:320px;
    }

    .floating-card{
        left:20px;
        right:20px;
        bottom:20px;

        padding:20px;
    }

    .floating-card h3{
        font-size:20px;
    }

}

@media (max-width:400px) {
      .error-left h1{
        font-size:60px;
        margin-bottom: 10px;
    }

    .error-left h2{
        font-size:20px;
    }

    .error-left p{
        font-size:14px;
        margin-bottom: 20px;
    }

    .btn-group a{
         padding:12px 25px;
        font-size: 14px;
      
    }

    .shop-btn{
       padding:12px 25px; 
    }

      .floating-card h3{
        font-size:17px;
    }

      .floating-card p{
        font-size:14px;
    }

      .error-left{
        padding:30px 25px;
    }

}

</style>
</head>

<body>

<!-- ================= 404 PAGE ================= -->

<div class="error-container">

    <!-- LEFT CONTENT -->

    <div class="error-left">

        <div class="logo">
            <img src="./src/logo.webp" alt="Company">
        </div>

        <h1>404</h1>

        <h2>Oops! Page Not Found</h2>

        <p>
            The fashion page you are looking for
            might have been removed, renamed,
            or temporarily unavailable.
        </p>

        <div class="btn-group">

            <a href="./index.html"
            class="home-btn">

                <i class="fa-solid fa-house"></i>
                Back To Home

            </a>

            <a href="./products.html"
            class="shop-btn">

                <i class="fa-solid fa-bag-shopping"></i>
                Continue Shopping

            </a>

        </div>

    </div>

    <!-- RIGHT IMAGE -->

    <div class="error-right">

        <div class="floating-card">

            <h3>
                New Fashion Collection
            </h3>

            <p>
                Explore premium outfits,
                trending styles and luxury
                fashion products.
            </p>

        </div>

    </div>

</div>

</body>
</html>
